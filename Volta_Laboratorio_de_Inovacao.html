function seedNumber(code,phase){let h=2166136261;for(const c of code+':'+phase){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return(h>>>0)%3-1;}
function newTeam(name,names,assignments,code,mode){
 if(!name.trim()||name.length>50)throw Error('Dê um nome à equipe, com até 50 caracteres.');
 if(!Array.isArray(names)||names.length<1||names.length>5||names.some(n=>!n.trim()||n.length>40))throw Error('Cadastre de 1 a 5 participantes, com nomes de até 40 caracteres.');
 if(new Set(names.map(n=>n.trim().toLocaleLowerCase())).size!==names.length)throw Error('Use nomes ou apelidos diferentes para identificar cada participante.');
 if(!Array.isArray(assignments)||assignments.length!==5||assignments.some(n=>!Number.isInteger(n)||n<0||n>=names.length))throw Error('Atribua os cinco papéis a participantes válidos.');
 if(names.some((_,i)=>!assignments.includes(i)))throw Error('Cada participante precisa assumir pelo menos um papel.');
 if(!/^[A-Z0-9-]{3,16}$/.test(code))throw Error('O código precisa ter de 3 a 16 letras, números ou hífens.');
 const t={id:'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:name.trim(),names:names.map(n=>n.trim()),assignments:[...assignments],code,mode:mode==='challenge'?'challenge':'guided',phase:0,status:'playing',state:{cash:100000,customers:0,trust:50,backlog:0,reserve:0,flags:{},evidence:[]},history:[],draft:null,presentation:{},created:new Date().toISOString()};
 startDraft(t);return t;
}
function startDraft(t){t.draft={actions:[],research:[],message:null,used:0,available:10-t.state.backlog,ledger:[],notes:{why:'',expect:'',risk:'',dissent:'',hypothesis:''},votes:Array(t.names.length).fill(''),selection:'',rolesSeen:[],reflection:{insight:'',change:'',transfer:''},reflectionSaved:false,roles:[...t.assignments],start:clone(t.state)};}
function changeCash(t,value,label){t.state.cash+=value;t.draft.ledger.push({label,value});}
function addTag(t,tag){if(tag&&!t.state.evidence.includes(tag))t.state.evidence.push(tag);}
function researchAction(t,id){
 if(t.status!=='playing')throw Error('A decisão desta fase já foi encerrada.');
 const r=PHASES[t.phase].research.find(x=>x.id===id);if(!r)throw Error('Pesquisa não encontrada.');
 if(t.draft.research.includes(id))return false;
 if(t.draft.used+r.effort>t.draft.available)throw Error('Capacidade insuficiente. Preserve unidades para decidir.');
 const min=Math.min(...PHASES[t.phase].options.map(o=>o.effort));if(t.draft.used+r.effort+min>t.draft.available)throw Error('Essa consulta deixaria a equipe sem capacidade para qualquer decisão.');
 t.draft.used+=r.effort;t.draft.research.push(id);t.draft.actions.push({type:'research',id});changeCash(t,-r.cost,'Consulta: '+r.title);addTag(t,r.tag);return true;
}
function messageAction(t,index){
 if(t.status!=='playing'||t.draft.message!==null)return false;
 const msg=PHASES[t.phase].inbox.responses[index];if(!msg)throw Error('Resposta não encontrada.');
 const min=Math.min(...PHASES[t.phase].options.map(o=>o.effort));if(t.draft.used+(msg.effort||0)+min>t.draft.available)throw Error('Capacidade insuficiente para responder e decidir nesta fase.');
 t.draft.used+=msg.effort||0;t.draft.message=index;t.draft.actions.push({type:'message',index});if(msg.cost)changeCash(t,-msg.cost,'Mensagem: '+msg.label);
 t.state.trust=clamp(t.state.trust+(msg.trust||0),0,100);if(msg.flag)Object.assign(t.state.flags,msg.flag);addTag(t,msg.tag);return true;
}
function serviceCapacity(s){let n=8;if(s.flags.solution==='full')n-=2;if(s.flags.solution==='curated')n--;if(s.flags.validatedOps)n+=2;if(s.flags.storage)n+=2;if(s.flags.ops==='expand')n+=7;if(s.flags.ops==='process')n+=4;if(s.flags.ops==='focus')n+=3;if(s.flags.teamReview)n++;if(s.flags.pivoted)n+=2;return n;}
function noteChecks(notes){return [['why',20,'Explique o raciocínio e as evidências em pelo menos 20 caracteres.'],['expect',12,'Registre o resultado esperado em pelo menos 12 caracteres.'],['risk',12,'Registre o risco aceito em pelo menos 12 caracteres.']].filter(([k,n])=>typeof notes[k]!=='string'||notes[k].trim().length<n);}
function resolveDecision(team,id,preview=false){
 const t=clone(team);if(t.status!=='playing')throw Error('Esta fase já tem uma decisão.');
 const p=PHASES[t.phase],o=p.options.find(x=>x.id===id);if(!o)throw Error('Escolha uma alternativa.');
 if(t.draft.used+o.effort>t.draft.available)throw Error('A alternativa não cabe na capacidade restante.');
 if(!preview&&noteChecks(t.draft.notes).length)throw Error(noteChecks(t.draft.notes)[0][2]);
 if(!preview&&t.draft.votes.some(v=>!p.options.some(x=>x.id===v)))throw Error('Registre uma posição para cada participante antes da decisão da equipe.');
 const reasons=[],trustBefore=t.state.trust,oldCustomers=t.state.customers;
 t.draft.used+=o.effort;changeCash(t,-o.cost,'Decisão: '+o.title);changeCash(t,-3000,'Custo fixo do ciclo');Object.assign(t.state.flags,o.flag);
 t.state.trust=clamp(t.state.trust+o.trust,0,100);t.state.customers=Math.max(0,t.state.customers+o.customers);
 if(t.draft.message===null){const n=p.inbox.ignoreTrust||0;t.state.trust=clamp(t.state.trust+n,0,100);reasons.push(p.inbox.ignored);}
 if(t.phase===2){const fit=(t.state.flags.segment==='network'&&o.id==='c')||(t.state.flags.segment==='seller'&&o.id==='b')||(t.state.flags.segment==='small'&&o.id==='a');if(fit){t.state.trust=clamp(t.state.trust+3,0,100);reasons.push('A proposta combina com o segmento no caso simulado: confiança +3.');}}
 if(t.phase===4&&o.id==='c'){changeCash(t,-8000,'Reserva de giro contratual (liberada na fase 9)');t.state.reserve=8000;}
 if(t.phase===5){
  const seg=t.state.flags.segment;const fit=(o.id==='a'&&seg==='small')||(o.id==='b'&&seg==='seller')||(o.id==='c'&&seg==='network');
  let extra=fit?3:0;if(fit)reasons.push('Canal aderente ao segmento: +3 clientes.');
  if(t.state.flags.validatedDemand){extra+=2;reasons.push('Compromissos do teste comercial: +2 clientes.');}
  if(t.state.evidence.includes('channel')){extra++;reasons.push('Pesquisa do canal: +1 cliente.');}
  const variation=seedNumber(t.code,5);extra+=variation;reasons.push('Variação do mercado definida pelo código '+t.code+': '+(variation>=0?'+':'')+variation+' cliente(s).');
  t.state.customers=Math.max(0,t.state.customers+extra);
  if(t.state.flags.promise48&&!t.state.flags.validatedOps&&!t.state.evidence.includes('logistics')){t.state.trust=clamp(t.state.trust-8,0,100);reasons.push('Prazo de 48 horas prometido sem preparação logística: confiança −8.');}
 }
 if(t.phase===7){let shock=t.state.flags.solution==='full'?9000:t.state.flags.solution==='curated'?5000:2500;
  // Use preparedness from the beginning of the phase, not the response to the crisis itself.
  if(t.draft.start.flags.diversified){shock*=0.5;reasons.push('Diversificação prévia reduziu o custo do choque pela metade.');}
  if(t.draft.start.evidence.includes('backup')){shock*=0.75;reasons.push('Pesquisa prévia de parceiro alternativo reduziu mais 25% do custo do choque.');}
  if(t.state.evidence.includes('crisisPlan')){shock*=0.8;reasons.push('Consulta a alternativas nesta fase reduziu mais 20% do custo do choque.');}
  shock=Math.round(shock);changeCash(t,-shock,'Choque externo: suspensão da transportadora');reasons.push('Custo do evento conforme exposição: '+shock.toLocaleString('pt-BR')+' reais.');
 }
 if(t.phase>=5){
  const cap=serviceCapacity(t.state),excess=Math.max(0,t.state.customers-cap);t.state.backlog=clamp(Math.ceil(excess/3),0,4);
  if(excess){const loss=Math.floor(excess/3);changeCash(t,-excess*500,'Retrabalho por '+excess+' cliente(s) acima da capacidade');t.state.trust=clamp(t.state.trust-excess*2,0,100);t.state.customers=Math.max(0,t.state.customers-loss);reasons.push('Capacidade de atendimento: '+cap+'. Excesso: '+excess+'. Retrabalho de R$ 500 por excedente, confiança −'+excess*2+' e perda de '+loss+' cliente(s).');}
  const unit={commission:850,service:1200,contract:1600}[t.state.flags.model]||850;
  const gross=t.state.customers*unit;changeCash(t,gross,'Contribuição de '+t.state.customers+' cliente(s) × R$ '+unit.toLocaleString('pt-BR'));reasons.push('Contribuição simplificada já desconta custos variáveis diretos. Não é faturamento bruto.');
 }
 if(t.phase===8&&t.state.reserve){changeCash(t,t.state.reserve,'Liberação da reserva de giro');t.state.reserve=0;}
 const record={phase:t.phase,choice:id,option:o.title,notes:clone(t.draft.notes),votes:[...t.draft.votes],actions:clone(t.draft.actions),research:[...t.draft.research],message:t.draft.message,roles:[...t.assignments],before:clone(t.draft.start),after:clone(t.state),ledger:clone(t.draft.ledger),used:t.draft.used,available:t.draft.available,result:o.result,next:o.next,reasons,reflection:{insight:'',change:'',transfer:''},reflectionSaved:false,trustDelta:t.state.trust-trustBefore,customerDelta:t.state.customers-oldCustomers};

function saveReflection(t,values){if(t.status!=='review')throw Error('Conclua a decisão antes da roda.');for(const k of ['insight','change','transfer'])if(typeof values[k]!=='string'||values[k].trim().length<12)throw Error('Preencha as três reflexões com pelo menos 12 caracteres cada.');const h=t.history[t.history.length-1];h.reflection=clone(values);h.reflectionSaved=true;t.draft.reflection=clone(values);t.draft.reflectionSaved=true;}
function advance(t){if(t.status!=='review'||!t.history.at(-1).reflectionSaved)throw Error('Registre a roda de aprendizagem antes de avançar.');if(t.phase===8){t.status='complete';return;}t.phase++;t.status='playing';startDraft(t);}
function rotateRoles(t){if(t.status!=='playing')throw Error('A decisão desta fase já foi registrada.');t.assignments=t.assignments.map(i=>(i+1)%t.names.length);t.draft.roles=[...t.assignments];}
function exportPayload(teams){return{app:'VOLTA',version:1,exported:new Date().toISOString(),teams:clone(teams)};}
function safeString(value,max=4000){if(typeof value!=='string'||value.length>max)throw Error('Backup contém texto inválido ou muito longo.');return value;}
function safeNotes(obj){if(!obj||typeof obj!=='object')throw Error('Registro de decisão inválido.');let out={};for(const k of ['why','expect','risk','dissent','hypothesis'])out[k]=safeString(obj[k]||'');return out;}
function safeReflection(obj){if(!obj||typeof obj!=='object')throw Error('Reflexão inválida.');let out={};for(const k of ['insight','change','transfer'])out[k]=safeString(obj[k]||'');return out;}
function validRoles(a,n){if(!Array.isArray(a)||a.length!==5||a.some(x=>!Number.isInteger(x)||x<0||x>=n)||Array.from({length:n},(_,i)=>i).some(i=>!a.includes(i)))throw Error('Papéis inválidos no backup.');return [...a];}
function replayActions(t,actions){if(!Array.isArray(actions)||actions.length>4)throw Error('Ações inválidas no backup.');for(const a of actions){if(a.type==='research')researchAction(t,safeString(a.id,40));else if(a.type==='message'&&Number.isInteger(a.index))messageAction(t,a.index);else throw Error('Ação desconhecida no backup.');}}
function restoreTeam(raw){
 if(!raw||typeof raw!=='object')throw Error('Equipe inválida.');
 const names=raw.names;if(!Array.isArray(names))throw Error('Participantes inválidos.');
 let t=newTeam(safeString(raw.name,50),names.map(n=>safeString(n,40)),validRoles(raw.assignments,names.length),safeString(raw.code,16),raw.mode);
 if(!Array.isArray(raw.history)||raw.history.length>9)throw Error('Histórico inválido.');
 for(let i=0;i<raw.history.length;i++){
  const r=raw.history[i];if(r.phase!==i)throw Error('As fases do backup estão fora de ordem.');t.assignments=validRoles(r.roles,names.length);t.draft.roles=[...t.assignments];replayActions(t,r.actions);t.draft.notes=safeNotes(r.notes);
  if(!Array.isArray(r.votes)||r.votes.length!==names.length)throw Error('Votos inválidos.');t.draft.votes=r.votes.map(x=>safeString(x,1));t=resolveDecision(t,safeString(r.choice,1));
  if(r.reflectionSaved)saveReflection(t,safeReflection(r.reflection));
  if(i<raw.history.length-1){advance(t);}
 }
 if(raw.status==='playing'){
  if(t.status==='review')advance(t);if(t.status!=='playing'||raw.phase!==t.phase)throw Error('Fase incompatível.');
  const d=raw.draft;if(!d)throw Error('Rascunho ausente.');t.assignments=validRoles(raw.assignments,names.length);t.draft.roles=[...t.assignments];replayActions(t,d.actions);t.draft.notes=safeNotes(d.notes);
  if(!Array.isArray(d.votes)||d.votes.length!==names.length||d.votes.some(v=>!['','a','b','c'].includes(v)))throw Error('Votos de rascunho inválidos.');t.draft.votes=[...d.votes];t.draft.selection=['a','b','c'].includes(d.selection)?d.selection:'';
  t.draft.rolesSeen=Array.isArray(d.rolesSeen)?d.rolesSeen.filter(v=>Number.isInteger(v)&&v>=0&&v<5):[];
 }else if(raw.status==='complete'){if(t.phase!==8||t.history.length!==9)throw Error('Partida incompleta.');advance(t);}else if(raw.status==='review'){if(t.status!=='review')throw Error('Revisão inválida.');if(raw.draft&&raw.draft.reflection)t.draft.reflection=safeReflection(raw.draft.reflection);}else throw Error('Estado inválido.');
 if(raw.presentation&&typeof raw.presentation==='object')for(const k of ['thesis','decisions','revision','impact','next','transfer'])t.presentation[k]=safeString(raw.presentation[k]||'',6000);

function restorePayload(data){if(!data||data.app!=='VOLTA'||data.version!==1||!Array.isArray(data.teams)||!data.teams.length||data.teams.length>40)throw Error('Escolha um backup JSON da Volta v1, com até 40 equipes.');const restored=data.teams.map(restoreTeam);if(new Set(restored.map(x=>x.id)).size!==restored.length)throw Error('Há equipes duplicadas no backup.');return restored;}

function home(){return `<section class="hero"><div><span class="eyebrow">Inovação se aprende em movimento<\/span><h1>Toda escolha<br>muda o próximo<br><em>passo.<\/em><\/h1><p>Uma startup. Nove missões. Um time que aprende decidindo, experimentando e conversando sobre o que aconteceu.<\/p><div class="row">${btn('Criar uma equipe <span aria-hidden="true">↗<\/span>','setup')}${btn('Conhecer a jornada','journey','','light')}<\/div><p class="small spaced">Até 5 pessoas por equipe · Jogo em uma tela compartilhada<\/p><\/div><div class="hero-visual"><div class="visual-label"><span>CASE / VOLTA<\/span><span>01 — 09<\/span><\/div>${scene(true)}<div class="visual-caption"><div class="circle" aria-hidden="true">↻<\/div><div><strong>O que está parado pode ganhar outra vida.<\/strong><span>Transformem móveis ociosos em uma oportunidade de negócio.<\/span><\/div><\/div><\/div><\/section><div class="intro-strip"><div><b>01<\/b><div><strong>Entendam o contexto<\/strong><span>Conteúdo e pistas para cada missão.<\/span><\/div><\/div><div><b>02<\/b><div><strong>Decidam em equipe<\/strong><span>Cinco papéis. Perspectivas diferentes.<\/span><\/div><\/div><div><b>03<\/b><div><strong>Reflitam e tentem de novo<\/strong><span>A próxima fase carrega suas escolhas.<\/span><\/div><\/div><\/div><section><div class="section-title"><div><span class="eyebrow">Sua mesa de trabalho<\/span><h2>Equipes e partidas<\/h2><\/div><div class="row">${btn('Importar partida','import','','light sm')}${teams.length?btn('Backup de todas','export-all','','light sm'):''}<\/div><\/div>${teams.length?`<div class="teamgrid">${teams.map(t=>`<article class="teamcard"><div class="row between"><span class="badge ${t.status==='complete'?'green':''}">${t.status==='complete'?'Encontro 10 · apresentação':'Fase '+(t.phase+1)+' de 9'}<\/span><span class="small muted">${esc(t.code)}<\/span><\/div><h3>${esc(t.name)}<\/h3><p class="small muted">${t.names.map(esc).join(' · ')}<\/p><div class="progressline"><span style="width:${t.h function learn(t){const p=PHASES[t.phase];return `<div class="panel"><span class="eyebrow">Conteúdo do encontro ${t.phase+1}<\/span><h2>${p.theme}<\/h2>${p.concepts.map((c,i)=>`<div class="spaced"><span class="tag">${String(i+1).padStart(2,'0')}<\/span><h3 style="margin-top:12px">${c[0]}<\/h3><p class="small">${c[1]}<\/p><\/div>`).join('')}<div class="notice">${p.tools}<\/div><p class="small"><strong>Entrega desta fase:<\/strong> ${p.deliverable}.<\/p>${btn('Aplicar na missão →','tab','data-tab="play"')}<\/div>`;}
function teamPanel(t){return `<div class="subheading"><h3>Antes de decidir, escutem cada perspectiva.<\/h3><span class="badge">${t.names.length} pessoa${t.names.length>1?'s':''}<\/span><\/div><p class="small muted">Informações de papel para discussão presencial. Nesta versão, todas ficam acessíveis na mesma tela; não são mensagens privadas.<\/p><div class="rolelist">${ROLES.map((r,i)=>`<article class="rolecard"><div class="row between"><h4>${r.icon} ${r.name}<\/h4><span class="tag">${esc(t.names[t.assignments[i]])}<\/span><\/div><p>${PHASES[t.phase].roles[i]}<\/p><div class="row between"><small class="muted">${r.desc}<\/small>${btn(t.draft.rolesSeen.includes(i)?'✓ Compartilhado':'Marcar como compartilhado','role-seen',`data-index="${i}"`,'light sm')}<\/div><\/article>`).join('')}<\/div><div class="notice">A pessoa responsável apresenta sua leitura. Depois, o grupo discute como as informações se conectam.<\/div>${btn('Voltar à decisão →','tab','data-tab="play"')}`;}
function play(t){const p=PHASES[t.phase],d=t.draft;return `<div class="subheading"><h3>Busquem evidências<\/h3><span class="small muted">Consultar é uma escolha de recursos.<\/span><\/div><div class="researchgrid">${p.research.map((r,i)=>{const opened=d.research.includes(r.id);return `<article class="researchcard ${opened?'open':''}"><span class="num">${opened?'✓':'0'+(i+1)}<\/span><h4>${r.title}<\/h4><div class="meta">${money(r.cost)} · ${r.effort} unidades<\/div>${opened?`<p>${r.text}<\/p><span class="badge green">Evidência registrada<\/span>`:btn('Consultar','research',`data-id="${r.id}"`,'light sm')}<\/article>`}).join('')}<\/div><details class="details mail"><summary>Caixa de entrada · ${d.message===null?'1 mensagem sem resposta':'respondida'}<\/summary><div class="inside"><span class="eyebrow">${p.inbox.from}<\/span><h3>${p.inbox.title}<\/h3><p>${p.inbox.body}<\/p>${d.message===null?`<div class="message-actions">${p.inbox.responses.map((r,i)=>btn(esc(r.label)+(r.cost?' · '+money(r.cost):'')+(r.effort?' · '+r.effort+' unidade(s)':''),'message',`data-index="${i}"`,'light sm')).join('')}<\/div><p class="small muted spaced">Responder é opcional. A mensagem expira ao confirmar a decisão.<\/p>`:`<div class="notice">${p.inbox.responses[d.message].text}<\/div>`}<\/div><\/details><div class="subheading spaced"><h3>Escolham o próximo passo<\/h3><span class="badge">Custo fixo: R$ 3 mil/ciclo<\/span><\/div>${t.mode==='challenge'?'<p class="small muted">Os custos são conhecidos. Os efeitos e as consequências serão revelados após a decisão.<\/p>':'<p class="small muted">Os efeitos abaixo ajudam a discutir a decisão. Podem mudar com as escolhas anteriores, os eventos e a capacidade.<\/p>'}<fieldset style="border:0;padding:0;margin:0"><legend class="eyebrow">Alternativas da equipe<\/legend>${p.options.map(o=>{const blocked=d.used+o.effort>d.available;const reserve=t.phase===4&&o.id==='c'?8000:0;return `<label class="choice ${d.selection===o.id?'selected':''} ${blocked?'blocked':''}"><input type="radio" name="decision" value="${o.id}" ${d.selection===o.id?'checked':''} ${blocked?'disabled':''}><div><h4>${o.id.toUpperCase()}. ${o.title}<\/h4><p>${o.desc}<\/p><div class="choice-meta"><span class="tag">${money(o.cost)}<\/span><span class="tag">${o.effort} unidades<\/span>${reserve?'<span class="tag">+ R$ 8 mil em reserva<\/span>':''}${blocked?'<span class="tag">Sem capacidade<\/span>':''}<\/div>${t.mode==='guided'?`<div class="effects">Efeito-base: confiança ${signed(o.trust)}${o.customers?', clientes '+signed(o.customers):''}. ${o.next}<\/div>`:''}<\/div><\/label>`}).join('')}<\/fieldset><section class="journal panel"><h3>Uma posição por pessoa<\/h3><p class="small muted">Registrem a preferência individual antes da decisão final. A maioria é consultiva; a equipe pode escolher outra alternativa e explicar por quê.<\/p><div class="vote-grid">${t.names.map((n,i)=>`<label class="field">${esc(n)}<select data-vote="${i}"><option value="">Escolher<\/option>${p.options.map(o=>`<option value="${o.id}" ${d.votes[i]===o.id?'selected':''}>${o.id.toUpperCase()} · ${o.title}<\/option>`).join('')}<\/select><\/label>`).join('')}<\/div><div id="vote-result" class="vote-result">${voteSummary(t)}<\/div>${btn('Usar a maioria como escolha','majority','','light sm')}<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h3>O diário da decisão<\/h3><p class="small muted">Façam o registro antes de conhecer os resultados. Ele fará parte da apresentação final.<\/p><label class="field">Por que escolhemos isso? Que evidências usamos? <span class="muted">*<\/span><textarea data-note="why" maxlength="4000" placeholder="Expliquem a escolha e citem uma informação que a sustentou…">${esc(d.notes.why)}<\/textarea><\/label><label class="field">O que esperamos que aconteça? <span class="muted">*<\/span><textarea data-note="expect" maxlength="4000" placeholder="Descrevam um resultado observável${t.phase===3?', incluindo o critério de sucesso do experimento':''}…">${esc(d.notes.expect)}<\/textarea><\/label><label class="field">Qual risco estamos aceitando? <span class="muted">*<\/span><textarea data-note="risk" maxlength="4000" placeholder="O que pode dar errado e por que aceitamos esse risco?">${esc(d.notes.risk)}<\/textarea><\/label><label class="field">Houve discordância ou uma informação que mudou a conversa?<textarea data-note="dissent" maxlength="4000" placeholder="Opcional: registrem uma perspectiva minoritária ou uma mudança de posição…">${esc(d.notes.dissent)}<\/textarea><\/label><\/section><div class="decision-foot"><p>Ao confirmar, a rodada é encerrada. As consultas, mensagens e justificativas ficam no histórico.<\/p>${btn('Confirmar decisão →','confirm')}<\/div>`;}
function voteSummary(t){const p=PHASES[t.phase];return p.options.map(o=>`${o.id.toUpperCase()}: ${t.draft.votes.filter(v=>v===o.id).length}`).join(' · ')+` · ${t.draft.votes.filter(Boolean).length}/${t.names.length} posições registradas`;}
function ledgerTable(h){return `<table class="ledger"><caption class="eyebrow" style="text-align:left">Movimentação de caixa da fase<\/caption><tbody><tr><td>Caixa no início<\/td><td>${money(h.before.cash)}<\/td><\/tr>${h.ledger.map(l=>`<tr><td>${esc(l.label)}<\/td><td class="${l.value<0?'negative':'positive'}">${l.value>0?'+':''}${money(l.value)}<\/td><\/tr>`).join('')}<tr><td>Caixa ao final<\/td><td>${money(h.after.cash)}<\/td><\/tr><\/tbody><\/table>`;}
function review(t){const h=t.history.at(-1),p=PHASES[t.phase],r=t.draft.reflection;return `<section class="result-banner"><span class="eyebrow">Fase ${t.phase+1} · O que aconteceu<\/span><h2>${h.option}<\/h2><p>${h.result}<\/p><div class="row"><span class="badge">Caixa: ${money(h.after.cash-h.before.cash)}<\/span><span class="badge">Clientes: ${signed(h.after.customers-h.before.customers)}<\/span><span class="badge">Confiança: ${signed(h.after.trust-h.before.trust)}<\/span><\/div><\/section><div class="panel">${ledgerTable(h)}<h3 class="spaced">Efeitos e compromissos<\/h3><ul class="cause-list">${h.reasons.map(s=>`<li>${esc(s)}<\/li>`).join('')}<li>${esc(h.next)}<\/li><\/ul>${h.after.backlog?`<div class="notice warn">${h.after.backlog} unidades de capacidade ficarão comprometidas no próximo ciclo por pendências de atendimento.<\/div>`:''}<\/div><details class="details"><summary>Rever a justificativa e os votos<\/summary><div class="inside">${decisionNotes(h,t)}<\/div><\/details><section class="reflection-box"><span class="eyebrow">A experiência vira aprendizagem aqui<\/span><h2>Hora de fazer a roda.<\/h2><p>Conversem sobre o resultado e também sobre a forma como chegaram à decisão. Registrem uma síntese do grupo, sem expor relatos pessoais que alguém queira manter privados.<\/p><ol class="cause-list">${p.reflection.map(q=>`<li>${q}<\/li>`).join('')}<\/ol><label class="field">O que aprendemos ou passamos a enxergar diferente?<textarea data-reflection="insight" maxlength="4000">${esc(r.insight)}<\/textarea><\/label><label class="field">O que vamos mudar na próxima rodada?<textarea data-reflection="change" maxlength="4000">${esc(r.change)}<\/textarea><\/label><label class="field">Como isso se conecta com uma situação real de trabalho?<textarea data-reflection="transfer" maxlength="4000">${esc(r.transfer)}<\/textarea><\/label><div class="row spaced">${btn(h.reflectionSaved?'Atualizar reflexão':'Registrar roda de aprendizagem','save-reflection')}${h.reflectionSaved?'<span class="badge green">✓ Roda registrada<\/span>':''}<\/div><\/section><div class="decision-foot"><p>A passagem para a próxima missão acontece depois da reflexão. A equipe carrega o estado atual do negócio.<\/p>${btn(t.phase===8?'Preparar apresentação →':'Abrir fase '+(t.phase+2)+' →','advance',h.reflectionSaved?'':'disabled')}<\/div>`;}
function decisionNotes(h,t){return `<dl><dt>Por que decidimos<\/dt><dd>${esc(h.notes.why)}<\/dd><dt>O que esperávamos<\/dt><dd>${esc(h.notes.expect)}<\/dd><dt>Risco aceito<\/dt><dd>${esc(h.notes.risk)}<\/dd>${h.notes.dissent?`<dt>Discordância ou mudança de posição<\/dt><dd>${esc(h.notes.dissent)}<\/dd>`:''}<\/dl><p class="small"><strong>Posições individuais:<\/strong> ${t.names.map((n,i)=>esc(n)+': '+esc((h.votes[i]||'—').toUpperCase())).join(' · ')}<\/p>`;}
function chart(t){const vals=[100000,...t.history.map(h=>h.after.cash)],min=Math.min(0,...vals),max=Math.max(100000,...vals),x=i=>35+i*580/9,y=v=>125-(v-min)/(max-min||1)*105;return `<div class="chart-wrap"><svg viewBox="0 0 650 160" role="img" aria-label="Evolução do caixa: ${vals.map(money).join(', ')}"><line x1="35" y1="${y(0)}" x2="615" y2="${y(0)}" stroke="#bbcbb0" stroke-dasharray="4 4"/><polyline points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="#24583f" stroke-width="3"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#c87045"/><text x="${x(i)}" y="148" text-anchor="middle" font-size="11" fill="#617057">${i===0?'Início':i}<\/text>`).join('')}<text x="35" y="12" font-size="10" fill="#617057">${money(max)}<\/text><\/svg><\/div>`;}
function historyCard(h,t){return `<article class="timeline-card"><div class="row"><span class="badge">Fase ${h.phase+1}<\/span><h3>${PHASES[h.phase].title}<\/h3><\/div><p><strong>${esc(h.option)}<\/strong><\/p><p class="small">${esc(h.result)}<\/p>${decisionNotes(h,t)}<div class="record-details"><p class="small"><strong>Consultas:<\/strong> ${h.research.length?h.research.map(id=>esc(PHASES[h.phase].research.find(r=>r.id===id).title)).join(' · '):'Nenhuma consulta adicional.'}<\/p><p class="small"><strong>Mensagem:<\/strong> ${h.message===null?'Sem resposta':esc(PHASES[h.phase].inbox.responses[h.message].label)}<\/p><p class="small"><strong>Papéis:<\/strong> ${ROLES.map((r,i)=>esc(r.short)+': '+esc(t.names[h.roles[i]])).join(' · ')}<\/p>${ledgerTable(h)}<ul class="cause-list spaced">${h.reasons.map(s=>`<li>${esc(s)}<\/li>`).join('')}<\/ul><\/div><div class="history-quote"><strong class="small">Roda de aprendizagem ${h.reflectionSaved?'registrada':'pendente'}<\/strong><dl><dt>Aprendizado<\/dt><dd>${esc(h.reflection.insight||'Ainda não registrado.')}<\/dd><dt>Mudança para a próxima rodada<\/dt><dd>${esc(h.reflection.change||'Ainda não registrada.')}<\/dd><dt>Conexão com o trabalho<\/dt><dd>${esc(h.reflection.transfer||'Ainda não registrada.')}<\/dd><\/dl><\/div><\/article>`;}
const PRESENTATION_FIELDS=[['thesis','Nossa tese de negócio','Que problema escolhemos e como nossa compreensão mudou?'],['decisions','Três decisões que mudaram a trajetória','Quais decisões foram decisivas e com quais evidências foram tomadas?'],['revision','O que faríamos diferente','Qual escolha revisaríamos sem usar informações que não tínhamos na época?'],['impact','Resultados e impactos','O que os indicadores mostram? Quais efeitos nos clientes, parceiros e equipe conseguimos sustentar com evidências?'],['next','Próximo ciclo','O que manter, mudar ou interromper? Qual será o próximo experimento?'],['transfer','Aprendizagem para o trabalho','Que comportamento vamos aplicar fora do jogo e como acompanharemos essa mudança?']];
function report(t){if(!t)return '<p>Nenhuma equipe selecionada.<\/p>';const n=t.history.length,done=t.status==='complete';return `<section class="report"><div class="row between no-print" style="margin-bottom:20px">${btn('← '+(done?'Equipes':'Voltar à missão'),done?'home':'back-game','','light sm')}<div class="row">${btn('Exportar relatório HTML','download-report','','light sm')}${btn('Imprimir / salvar PDF','print','','light sm')}${btn('Backup da partida','export',`data-id="${t.id}"`,'light sm')}<\/div><\/div><div class="report-hero"><span class="eyebrow">${done?'Encontro 10 · Conselho de aprendizagem':'Relatório parcial · Jornada em andamento'}<\/span><h1>${esc(t.name)}<\/h1><p>${t.names.map(esc).join(' · ')}<\/p><span class="small">Cenário ${esc(t.code)} · ${n}/9 decisões · ${t.mode==='guided'?'Modo didático':'Modo desafio'}<\/span><div class="report-metrics"><div><strong>${money(t.state.cash)}<\/strong><span>Caixa disponível<\/span><\/div><div><strong>${t.state.customers}<\/strong><span>Clientes ativos<\/span><\/div><div><strong>${t.state.trust}/100<\/strong><span>Confiança simulada<\/span><\/div><div><strong>${t.history.filter(h=>h.reflectionSaved).length}/9<\/strong><span>Rodas registradas<\/span><\/div><\/div><\/div>${!done?'<div class="notice no-print">Este é um relatório parcial. O roteiro final fica disponível após a nona roda.<\/div>':''}<div class="report-summary"><div class="panel"><h3>O caminho do caixa<\/h3>${chart(t)}<p class="small muted">Contribuição por cliente desconta custos variáveis diretos. Investimentos, reservas e custo fixo aparecem no histórico.<\/p><\/div><div class="panel"><h3>Rastros de aprendizagem<\/h3><div class="coverage"><span>Decisões justificadas<\/span><strong>${n}/9<\/strong><\/div><div class="coverage"><span>Consultas realizadas<\/span><strong>${t.history.reduce((s,h)=>s+h.research.length,0)}<\/strong><\/div><div class="coverage"><span>Rodadas com votos diferentes<\/span><strong>${t.history.filter(h=>new Set(h.votes).size>1).length}<\/strong><\/div><div class="coverage"><span>Reflexões registradas<\/span><strong>${t.history.filter(h=>h.reflectionSaved).length}/9<\/strong><\/div><p class="small muted spaced">São registros de participação, não notas de competência. A qualidade do raciocínio deve ser discutida com o facilitador.<\/p><\/div><\/div><div class="panel"><h3>O negócio que construímos<\/h3><div class="row">${['segment','solution','model','future'].filter(k=>t.state.flags[k]).map(k=>`<span class="badge">${esc(LABELS[t.state.flags[k]]||t.state.flags[k])}<\/span>`).join('')||'<span class="muted small">As primeiras escolhas ainda serão feitas.<\/span>'}<\/div>${t.state.reserve?`<p class="small spaced">Reserva de giro separada: ${money(t.state.reserve)}.<\/p>`:''}<\/div>${done?`<section class="spaced"><div class="section-title"><div><span class="eyebrow">Preparem sua apresentação<\/span><h2>Defendam a trajetória.<\/h2><\/div><span class="badge">Sugestão: 12 min + 8 min de perguntas<\/span><\/div><p class="small muted no-print">Preencham o roteiro. As respostas são salvas no navegador e incluídas na exportação e na impressão.<\/p><div class="panel">${PRESENTATION_FIELDS.map(([key,label,hint])=>`<label class="field">${label}<small>${hint}<\/small><textarea class="presentation-input" data-presentation="${key}" maxlength="6000">${esc(t.presentation[key]||'')}<\/textarea><\/label><div class="print-only"><h3>${label}<\/h3><p class="print-answer" data-print="${key}">${esc(t.presentation[key]||'Ainda não registrado.')}<\/p><\/div>`).join('')}<\/div><div class="notice">A banca examina uso de evidências, experimentação, colaboração e capacidade de rever decisões. O resultado financeiro é analisado separadamente; não há campeão automático pelo maior caixa.<\/div><\/section>`:''}<section class="spaced"><span class="eyebrow">Memória da equipe<\/span><h2>Decisões, consequências e reflexões.<\/h2>${t.history.length?t.history.map(h=>historyCard(h,t)).join(''):'<p class="muted">As decisões aparecerão aqui conforme a equipe avançar.<\/p>'}<\/section><p class="small muted spaced">Volta v${VERSION} · Valores, personagens e regras fictícios, criados para aprendizagem. A simulação não é uma previsão de mercado nem uma avaliação validada de competências.<\/p><\/section>`;}
function journey(){return `<section class="guide"><span class="eyebrow">10 encontros · uma história contínua<\/span><h1>Aprender. Decidir.<br>Refletir. Continuar.<\/h1><p class="muted">A Volta conecta empresas com móveis ociosos a negócios que precisam montar seus espaços. A solução emerge das escolhas de cada equipe.<\/p><div class="journey-grid spaced">${PHASES.map((p,i)=>`<article class="journey-tile"><b>${String(i+1).padStart(2,'0')}<\/b><h3>${p.title}<\/h3><p>${p.theme}<\/p><p style="margin-top:12px"><strong>Entrega:<\/strong> ${p.deliverable}.<\/p><\/article>`).join('')}<article class="journey-tile" style="background:var(--green);color:white"><b style="color:var(--lime)">10<\/b><h3>Conselho de aprendizagem<\/h3><p style="color:#d6e1cf">Cada equipe apresenta decisões, resultados, mudanças de entendimento e próximos passos.<\/p><\/article><\/div><div class="notice spaced">As fases são desbloqueadas em sequência após o registro da roda. O facilitador combina com a turma quando avançar. O HTML não possui autenticação nem bloqueio remoto de encontros.<\/div><div class="row">${btn('Criar equipe','setup')}${btn('Guia de facilitação','guide','','light')}<\/div><\/section>`;}
function guide(){return `<section class="guide"><span class="eyebrow">Para quem facilita<\/span><h1>A conversa faz<br>parte do jogo.<\/h1><p class="muted">Use a simulação para criar situações compartilhadas e a roda para examinar como a equipe interpreta, decide e aprende.<\/p><div class="guide-grid spaced"><div class="panel"><h3>Como organizar<\/h3><p>Forme equipes de 1 a 5 pessoas. Cada uma joga reunida em uma tela. Distribua os cinco papéis; em equipes menores, uma pessoa assume mais de um.<\/p><p>Use o mesmo código para comparar cenários. Os dados de uma equipe não alteram os de outra. Não há competição por um mercado compartilhado nesta versão.<\/p><\/div><div class="panel"><h3>O que está automatizado<\/h3><p>Custos, indicadores, eventos, memória das decisões, desbloqueio das fases e relatório. As falas de personagens são roteirizadas.<\/p><p>Não há IA externa, contas de usuário, sala online ou sincronização entre computadores. As justificativas não recebem uma nota automática.<\/p><\/div><\/div><details class="details" open><summary>Roteiro sugerido para 120 minutos<\/summary><div class="inside overflow"><table><thead><tr><th>Momento<\/th><th>Tempo<\/th><th>Objetivo<\/th><\/tr><\/thead><tbody><tr><td>Conteúdo e provocação<\/td><td>20 min<\/td><td>Apresentar conceitos úteis para a missão<\/td><\/tr><tr><td>Atualização da história<\/td><td>10 min<\/td><td>Recuperar consequências e abrir o desafio<\/td><\/tr><tr><td>Jogo em equipe<\/td><td>35 min<\/td><td>Consultar, discutir, registrar posições e decidir<\/td><\/tr><tr><td>Leitura dos resultados<\/td><td>15 min<\/td><td>Examinar os efeitos e as contas<\/td><\/tr><tr><td>Roda de aprendizagem<\/td><td>30 min<\/td><td>Discutir escolhas, comportamentos e experiências<\/td><\/tr><tr><td>Registro e aplicação<\/td><td>10 min<\/td><td>Definir uma mudança para o próximo ciclo<\/td><\/tr><\/tbody><\/table><\/div><\/details><details class="details"><summary>Regras transparentes do protótipo<\/summary><div class="inside"><ul><li>Caixa inicial: R$ 100 mil. Custo fixo: R$ 3 mil em cada uma das nove fases.<\/li><li>Consultas e alternativas têm custos e esforço explícitos. Consultas são cobradas imediatamente. A decisão é cobrada uma única vez ao confirmar.<\/li><li>Cada rodada tem 10 unidades de capacidade, menos até 4 comprometidas por pendências do ciclo anterior. Não é uma medida de tempo real.<\/li><li>Na fase 6, a aquisição soma a base do canal, aderência ao segmento (+3), teste comercial prévio (+2), pesquisa de canal (+1) e uma variação de −1 a +1 determinada pelo código.<\/li><li>A partir da fase 6, clientes ativos geram contribuição por ciclo: R$ 850 em comissão, R$ 1.200 em pacote ou R$ 1.600 em contrato. É uma simplificação didática, já líquida de custos variáveis diretos. Não representa faturamento bruto nem retenção real.<\/li><li>Contratos separam R$ 8 mil em reserva de giro na fase 5 e liberam esse valor na fase 9.<\/li><li>A capacidade-base de atendimento é de 8 clientes. Serviço completo reduz 2 e curadoria reduz 1. Piloto operacional e armazenamento acrescentam 2 cada. Expansão operacional acrescenta 7, melhoria de processos 4, foco 3, revisão de equipe 1 e redução da promessa na crise 2.<\/li><li>Acima da capacidade, cada cliente excedente gera R$ 500 de retrabalho e reduz a confiança em 2. A cada 3 excedentes, perde-se 1 cliente. Pendências ocupam uma unidade a cada 3 excedentes, arredondada para cima e limitada a 4.<\/li><li>Na fase 8, o choque custa R$ 9 mil para serviço completo, R$ 5 mil para curadoria ou R$ 2,5 mil para intermediação. Diversificação prévia reduz 50%; pesquisa prévia de alternativa reduz mais 25%; pesquisa de plano de crise na fase reduz mais 20%.<\/li><li>Confiança varia de 0 a 100. Clientes nunca ficam negativos. Caixa pode ficar negativo: o jogo continua para discutir recuperação e compromissos.<\/li><li>O código conserva as variações do mercado. Diferenças de resultado vêm também das escolhas, consultas e mensagens.<\/li><\/ul><p>As regras são parâmetros de um piloto educacional e precisam ser calibradas com uma turma. Conhecê-las não equivale a prever um negócio real.<\/p><\/div><\/details><details class="details"><summary>Conduzir a roda sem transformar tudo em uma nota<\/summary><div class="inside"><p>Comece pelo que aconteceu, passe para como a equipe decidiu e termine com o que vai mudar. Convide perspectivas diferentes; ninguém precisa expor experiências pessoais.<\/p><p>Pergunte: “Qual informação tínhamos naquele momento?” “Quem mudou de opinião?” “Que evidência poderia contrariar nossa escolha?” “O que vamos testar no próximo encontro?”<\/p><p>Na apresentação, examine evidências, desenho dos testes, consideração de riscos, colaboração e revisão de decisões. Use registros observáveis. Quantidade de texto e caixa final não são medidas suficientes de aprendizagem.<\/p><\/div><\/details><details class="details"><summary>Rodízio, dispositivos e backups<\/summary><div class="inside"><p>Nas fases 4 e 7 há um botão de rodízio. Cada responsabilidade passa para a próxima pessoa. Façam uma passagem com aprendizados, compromissos e perguntas em aberto.<\/p><p>O salvamento usa o navegador atual e pode depender de suas configurações, especialmente ao abrir arquivos locais. Exporte o backup ao final de cada encontro. Para mudar de computador, abra este HTML e importe o JSON.<\/p><p>Importações são adicionadas como partidas separadas. Não há mesclagem simultânea: escolham uma cópia principal da equipe. Não registrem dados pessoais sensíveis nos campos.<\/p><\/div><\/details><div class="row spaced">${btn('Criar uma equipe','setup')}${btn('Ver a trilha','journey','','light')}<\/div><\/section>`;}
function setView(v){view=v;timerRunning=false;render(true);}
function replaceTeam(t){const i=teams.findIndex(x=>x.id===t.id);teams[i]=t;persist();}
function captureSetup(){const f=$('#setup-form');if(!f)return;setup.name=f.elements.teamname.value;setup.code=f.elements.code.value.toUpperCase();setup.names=setup.names.map((_,i)=>f.elements['member-'+i].value);setup.roles=[...f.querySelectorAll('[data-assignment]')].map(e=>Number(e.value));setup.mode=f.elements.mode.value;}
function modal(title,body,actions=''){modalReturn=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" data-action="close-modal" aria-label="Fechar">×<\/button><h2 id="modal-title">${title}<\/h2>${body}${actions?`<div class="row">${actions}<\/div>`:''}<\/section><\/div>`;$('#modal-root button').focus();}
function closeModal(){ $('#modal-root').innerHTML='';if(modalReturn&&modalReturn.isConnected)modalReturn.focus();}
function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
const filename=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9_-]+/gi,'_').slice(0,60)||'equipe';
function downloadReport(t){const element=document.createElement('div');element.innerHTML=report(t);element.querySelectorAll('.no-print,button,.field').forEach(el=>el.remove());element.querySelectorAll('.print-only').forEach(el=>{el.classList.remove('print-only');});const body=`<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volta · ${esc(t.name)} · Relatório<\/title><style>${$('#app-style').textContent}\nbody{background:#fffef9}.wrap{max-width:1000px}.report .print-answer{white-space:pre-wrap}<\/style><body><main class="wrap">${element.innerHTML}<\/main><\/body><\/html>`;download(body,'Volta_Relatorio_'+filename(t.name)+'.html','text/html;charset=utf-8');toast('Relatório exportado com decisões e reflexões.');}
function updateTimer(){const c=$('#timer-clock');if(c)c.textContent=String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0');const b=$('[data-action="timer"]');if(b)b.textContent=timerRunning?'Pausar':'Debater';}
setInterval(()=>{if(timerRunning&&timerSeconds>0){timerSeconds--;updateTimer();if(timerSeconds===0){timerRunning=false;updateTimer();toast('Tempo de debate encerrado. Registrem as posições e a justificativa.');}}},1000);
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;e.preventDefault();const a=el.dataset.action;const t=current();try{
 if(a==='home')setView('home');
 else if(a==='setup'){setup={name:'',names:['','','','',''],roles:[0,1,2,3,4],code:'VOLTA-01',mode:'guided'};setView('setup');}
 else if(a==='journey'||a==='guide')setView(a);
 else if(a==='add-member'){captureSetup();if(setup.names.length<5){setup.names.push('');setup.roles=ROLES.map((_,i)=>i%setup.names.length);render();}}
 else if(a==='remove-member'){captureSetup();if(setup.names.length>1){setup.names.splice(Number(el.dataset.index),1);setup.roles=ROLES.map((_,i)=>i%setup.names.length);render();}}
 else if(a==='open'){activeId=el.dataset.id;tabView='play';setView(current().status==='complete'?'report':'game');}
 else if(a==='team-report'){activeId=el.dataset.id;setView('report');}
 else if(a==='back-game')setView('game');
 else if(a==='report')setView('report');
 else if(a==='tab'){tabView=el.dataset.tab;render();const tb=$('#tab-'+tabView);if(tb)tb.focus({preventScroll:true});}
 else if(a==='role-seen'){const i=Number(el.dataset.index);t.draft.rolesSeen=t.draft.rolesSeen.includes(i)?t.draft.rolesSeen.filter(x=>x!==i):[...t.draft.rolesSeen,i];persist();render();}
 else if(a==='research'){researchAction(t,el.dataset.id);persist();render();toast('Consulta registrada. Custo e capacidade atualizados.');}
 else if(a==='message'){messageAction(t,Number(el.dataset.index));persist();render();const mail=$('details.mail');if(mail)mail.open=true;toast('Resposta registrada.');}
 else if(a==='majority'){if(t.draft.votes.some(v=>!v))throw Error('Registre a posição de cada participante.');const counts=PHASES[t.phase].options.map(o=>({id:o.id,n:t.draft.votes.filter(v=>v===o.id).length})).sort((x,y)=>y.n-x.n);if(counts[0].n===counts[1].n)throw Error('Há empate. A equipe precisa discutir e selecionar uma alternativa.');const option=PHASES[t.phase].options.find(o=>o.id===counts[0].id);if(t.draft.used+option.effort>t.draft.available)throw Error('A alternativa mais votada não cabe na capacidade restante. Discutam uma opção viável.');t.draft.selection=counts[0].id;persist();render();toast('Alternativa mais votada selecionada. A decisão ainda precisa ser confirmada.');}
 else if(a==='confirm'){const selected=t.draft.selection;if(!selected)throw Error('Escolham uma alternativa para a equipe.');const checks=noteChecks(t.draft.notes);if(checks.length){const field=$('[data-note="'+checks[0][0]+'"]');field.focus();throw Error(checks[0][2]);}if(t.draft.votes.some(v=>!v))throw Error('Registrem uma posição para cada participante.');const outcome=resolveDecision(t,selected);const o=PHASES[t.phase].options.find(x=>x.id===selected);modal('Confirmar a decisão?',`<p><strong>${esc(o.title)}<\/strong><\/p><p>A rodada consumirá ${money(o.cost)} em investimento e R$ 3 mil de custo fixo, além dos efeitos do cenário. A escolha e a justificativa serão registradas.<\/p><p class="small muted">Consultas já realizadas permanecem cobradas. Após confirmar, a rodada não pode ser editada.<\/p>`,btn('Voltar ao debate','close-modal','','light')+btn('Confirmar e ver consequências','commit'));}
 else if(a==='commit'){const next=resolveDecision(t,t.draft.selection);replaceTeam(next);closeModal();timerRunning=false;render(true);}
 else if(a==='save-reflection'){saveReflection(t,t.draft.reflection);persist();render();toast('Roda registrada. A próxima etapa está liberada.');}
 else if(a==='advance'){advance(t);persist();tabView='play';setView(t.status==='complete'?'report':'game');}
 else if(a==='rotate'){modal('Trocar as perspectivas?',`<p>Cada papel passa para a próxima pessoa. Façam uma breve passagem sobre o que já foi aprendido e os compromissos em aberto.<\/p>`,btn('Cancelar','close-modal','','light')+btn('Confirmar rodízio','commit-rotate'));}
 else if(a==='commit-rotate'){rotateRoles(t);persist();closeModal();tabView='team';render();toast('Papéis atualizados. Façam a passagem de responsabilidades.');}
 else if(a==='phase'){const i=Number(el.dataset.index);if(i===t.phase){tabView='play';render(true);}else if(i<t.phase){const h=t.history[i];modal('Memória da fase '+(i+1),`<div class="report">${historyCard(h,t)}<\/div>`);}}
 else if(a==='export'||a==='export-all'){const list=a==='export-all'?teams:[teams.find(x=>x.id===el.dataset.id)];download(JSON.stringify(exportPayload(list),null,2),'Volta_Backup_'+(a==='export-all'?'Equipes':filename(list[0].name))+'.json','application/json');toast('Backup exportado. Guarde o JSON junto do HTML.');}
 else if(a==='import')$('#import-file').click();
 else if(a==='download-report')downloadReport(t);
 else if(a==='print')window.print();
 else if(a==='close-modal')closeModal();
 else if(a==='timer'){if(!timerSeconds)timerSeconds=120;timerRunning=!timerRunning;updateTimer();}
 else if(a==='reset-timer'){timerRunning=false;timerSeconds=120;updateTimer();}
 }catch(err){toast(err.message,true);}});
document.addEventListener('input',e=>{const t=current(),el=e.target;if(el.dataset.note&&t&&t.status==='playing'){t.draft.notes[el.dataset.note]=el.value;persist();}if(el.dataset.reflection&&t&&t.status==='review'){t.draft.reflection[el.dataset.reflection]=el.value;const h=t.history.at(-1);h.reflectionSaved=false;t.draft.reflectionSaved=false;const next=$('[data-action="advance"]');if(next)next.disabled=true;persist();}if(el.dataset.presentation&&t){t.presentation[el.dataset.presentation]=el.value;const pr=$('[data-print="'+el.dataset.presentation+'"]');if(pr)pr.textContent=el.value||'Ainda não registrado.';persist();}if(el.dataset.member!==undefined){const i=Number(el.dataset.member);setup.names[i]=el.value;document.querySelectorAll('[data-assignment] option[value="'+i+'"]').forEach(o=>o.textContent=el.value||'Pessoa '+(i+1));}});
document.addEventListener('change',e=>{const t=current(),el=e.target;if(el.name==='decision'&&t){t.draft.selection=el.value;persist();document.querySelectorAll('.choice').forEach(c=>c.classList.toggle('selected',c.querySelector('input').checked));}if(el.dataset.vote!==undefined&&t){t.draft.votes[Number(el.dataset.vote)]=el.value;persist();$('#vote-result').textContent=voteSummary(t);}});
document.addEventListener('submit',e=>{if(e.target.id!=='setup-form')return;e.preventDefault();try{captureSetup();if(teams.length>=40)throw Error('O navegador já tem 40 equipes. Use outro perfil ou computador para uma nova turma.');const t=newTeam(setup.name,setup.names,setup.roles,setup.code,setup.mode);teams.push(t);activeId=t.id;persist();tabView='play';setView('game');}catch(err){$('#setup-error').textContent=err.message;$('#setup-error').scrollIntoView({block:'center'});}});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('O backup excede o limite de 5 MB.');const restored=restorePayload(JSON.parse(await file.text()));if(teams.length+restored.length>40)throw Error('A importação excederia o limite de 40 equipes neste navegador.');for(const t of restored){if(teams.some(x=>x.id===t.id)){t.id='v'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);t.name=(t.name+' (cópia)').slice(0,50);}teams.push(t);}persist();setView('home');toast(restored.length+' equipe(s) importada(s). Nenhuma partida existente foi substituída.');}catch(err){toast('Não foi possível importar: '+err.message,true);}finally{e.target.value='';}});
document.addEventListener('keydown',e=>{const dialog=$('[role="dialog"]');if(!dialog)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const nodes=[...dialog.querySelectorAll('button,a,input,select,textarea')].filter(n=>!n.disabled),first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script></body></html>
